version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    ignore:
      # @astrojs/check only supports typescript ^5 || ^6; a 7.x bump makes
      # `npm ci` fail with ERESOLVE. Drop once it allows 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      # init and analyze must run the same version or CodeQL fails with a
      # configuration error, so they have to be bumped in one PR.
      codeql-action:
        patterns:
          - "github/codeql-action/*"
